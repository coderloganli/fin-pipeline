# Services this platform needs, for local development and for CI.
#
# One service: Postgres, which serves the mart. The host machine edits code and runs
# tests; it does not run the database. See docs/adr/0004-services-run-in-containers.md.
#
# There is no orchestrator here. A run is `python -m pipeline daily`, and scheduling it
# is a cron entry - which it can be because the order, the stop-on-failure rule, the run
# record and the clearing of the affected-period set all live in `pipeline/` rather than
# in whatever starts it. See docs/adr/0046.

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fin_pipeline}
      POSTGRES_USER: ${POSTGRES_USER:-fin_pipeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fin_pipeline}
    ports:
      # Host side follows POSTGRES_PORT so that editing .env moves the database
      # and the tests together; the container side is always Postgres's own port.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres:18 stores data under a major-version-specific subdirectory and
      # refuses to start if the volume is mounted at the old .../data path. The
      # mount goes one level up. See docker-library/postgres#1259.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      # Without this, a test suite can reach the container before the database
      # inside it is accepting connections.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fin_pipeline} -d ${POSTGRES_DB:-fin_pipeline}"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
