# The chart of accounts, effective-dated.
#
# The primary key includes effective_date because an account's attributes change over
# time and the old row stays. A key of account_code alone would reject the history
# this dimension exists to keep.

table: dim_account_src
primary_key: [account_code, effective_date]

# What this table reaches downstream.
# The effective-dated versions become the SCD2 dimension. See docs/adr/0035.
feeds:
  - landing.dim_account

# A version, once landed, never changes: a change to this dimension is supposed to
# arrive as a new effective_date. The same key coming back with different values is the
# source restating its own past, and it fails the run rather than overwriting what the
# warehouse holds. See docs/adr/0023-raw-never-forgets-a-primary-key.md.
rows_are_immutable: true

columns:
  - name: account_code
    type: string
    nullable: false

  - name: name
    type: string
    nullable: false

  # Empty for a top-level account: it has no parent. This is why the column is
  # nullable, and why an empty CSV field has to mean null rather than the string "".
  - name: parent_code
    type: string
    nullable: true

  - name: account_type
    type: string
    nullable: false
    allowed: [asset, liability, equity, revenue, expense]

  - name: effective_date
    type: date
    nullable: false
