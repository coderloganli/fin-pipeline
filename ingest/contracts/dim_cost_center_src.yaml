# Cost centres and the department each belongs to, effective-dated.
#
# The primary key includes effective_date. A cost centre that moves to another
# department mid-year has two rows, and that reorganisation is the scenario the
# point-in-time join exists to handle - not a duplicate to reject. A key of cc_code
# alone would call the project's own central example a contract violation.

table: dim_cost_center_src
primary_key: [cc_code, effective_date]

# What this table reaches downstream.
# The effective-dated versions become the SCD2 dimension. See docs/adr/0035.
feeds:
  - landing.dim_cost_center

# A version, once landed, never changes: a change to this dimension is supposed to
# arrive as a new effective_date. The same key coming back with different values is the
# source restating its own past, and it fails the run rather than overwriting what the
# warehouse holds. See docs/adr/0023-raw-never-forgets-a-primary-key.md.
rows_are_immutable: true

columns:
  - name: cc_code
    type: string
    nullable: false

  - name: name
    type: string
    nullable: false

  - name: dept_code
    type: string
    nullable: false

  - name: effective_date
    type: date
    nullable: false
