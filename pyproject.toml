[project]
name = "fin-pipeline"
version = "0.1.0"
description = "A finance data platform where the hard problems are data engineering ones"
requires-python = ">=3.13"

# Core: what the platform needs to talk to its own database, and to read the source
# contracts, which are consulted at ingest time rather than only under test.
dependencies = [
    "psycopg[binary]",
    "pyyaml",
]

# Declared, but installed by nobody yet. The task that first needs one of these
# is the task that makes it install, and that is where its version floor and any
# toolchain requirement get settled. See docs/adr/0003-how-dependencies-are-declared.md.
[project.optional-dependencies]
dev = [
    "pytest",
]
spark = ["pyspark>=4.2"]
dbt = ["dbt-core>=1.10", "dbt-postgres"]
ml = ["scikit-learn"]
app = ["streamlit"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["generator", "ingest", "ingest.contracts"]

[tool.setuptools.package-data]
# The contracts are data the package reads at runtime, so they have to ship with it.
"ingest.contracts" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs a running Postgres. Start it with `docker compose up -d`.",
]
