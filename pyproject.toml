[project]
name = "fin-pipeline"
version = "0.1.0"
description = "A finance data platform where the hard problems are data engineering ones"
requires-python = ">=3.13"

# Core: what the platform needs to talk to its own database.
dependencies = [
    "psycopg[binary]",
]

# Declared, but installed by nobody yet. The task that first needs one of these
# is the task that makes it install, and that is where its version floor and any
# toolchain requirement get settled. See docs/adr/0003-how-dependencies-are-declared.md.
[project.optional-dependencies]
dev = [
    "pytest",
    "pyyaml",
]
spark = ["pyspark>=4.2"]
dbt = ["dbt-core>=1.10", "dbt-postgres"]
ml = ["scikit-learn"]
app = ["streamlit"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# No importable package has landed yet; the directories carry READMEs only.
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs a running Postgres. Start it with `docker compose up -d`.",
]
