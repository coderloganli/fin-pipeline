version: 2

sources:
  # The six source tables, landed by transform/load.py exactly as they arrived: text,
  # the columns each contract declares, and for the entry tables the accounting period
  # they were partitioned by plus the two run identifiers ingest stamps on a raw row.
  #
  # The source is named `landing` whatever schema it actually resolves to, because
  # ingest/contracts/*.yaml declares `feeds` against this name and the impact list has to
  # stay stable across a test's own schemas. See docs/adr/0034 and 0035.
  - name: landing
    schema: "{{ env_var('POSTGRES_LANDING_SCHEMA', 'landing') }}"
    description: >
      The source extracts, in Postgres. Every transformation downstream of this is a
      model in this project, so the only edge in the graph that is not a ref() is the
      copy that puts these here.
    # No freshness. This is a rebuild, not a feed, and a freshness rule here would
    # assert something no run makes true.
    tables:
      - name: gl_entry
      - name: gl_adjustment
      - name: dim_account_src
      - name: dim_cost_center_src
      - name: dim_vendor
      - name: fx_rate
